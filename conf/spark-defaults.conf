# 1. Cluster Execution (Fixes the 'local' trap)
spark.master                     spark://spark-master:7077

# 2. Event Logging
spark.eventLog.enabled           true
spark.eventLog.dir               file:/tmp/spark-events
spark.history.fs.logDirectory    file:/tmp/spark-events

# 3. Memory and Performance
spark.executor.memory            512m
spark.executor.cores             1

# 4. Delta Lake Configuration
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.jars                       /opt/spark/conf/delta-spark_2.12-3.1.0.jar,/opt/spark/conf/delta-storage-3.1.0.jar

# 5. Metrics System (Tells Spark to expose hardware data to Prometheus)
#spark.metrics.conf               /opt/spark/conf/metrics.properties
# Enable Native Spark 3 Prometheus Exporter
spark.ui.prometheus.enabled      true
# ==========================================
# 5. Native Metrics System (Direct Config)
# ==========================================
# Enable JVM Metrics Source
spark.metrics.conf.*.source.jvm.class     org.apache.spark.metrics.source.JvmSource

# Enable StatsD Sink (Push to Prometheus Exporter)
spark.metrics.conf.*.sink.statsd.class    org.apache.spark.metrics.sink.StatsdSink
spark.metrics.conf.*.sink.statsd.host     statsd-exporter
spark.metrics.conf.*.sink.statsd.port     9125
spark.metrics.conf.*.sink.statsd.prefix   spark

# Add these two lines:
spark.metrics.conf.*.sink.statsd.period   1
spark.metrics.conf.*.sink.statsd.unit     seconds